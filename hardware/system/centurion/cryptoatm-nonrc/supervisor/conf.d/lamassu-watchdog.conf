[program:lamassu-watchdog]
command=/usr/bin/node /opt/lamassu-machine/watchdog.js centurion cryptoatm-nonrc
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/lamassu-watchdog.err.log
stdout_logfile=/var/log/supervisor/lamassu-watchdog.out.log
stdout_logfile_backups=2
stderr_logfile_backups=2
